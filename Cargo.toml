[package]
name = "collabo"
version = "0.1.0"
edition = "2021"
authors = ["Dhruv Dhamani <ddhamani@charlotte.edu>"]

[dependencies]
anyhow = { version = "1.0.82", features = ["backtrace"] }
genetic_algorithms = "1.6.0"
itertools = "0.14.0"
num_cpus = "1.16.0"
rand_distr = { version = "0.5.1", features = ["serde"] }
statrs = "0.18.0"

[dependencies.rand]
version = "0.9.2"
features = ["serde", "small_rng"]
